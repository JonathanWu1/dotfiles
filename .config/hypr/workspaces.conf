# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:DP-1 #terminal
workspace = 2, monitor:DP-1 #rider
workspace = 3, monitor:DP-1 #browser
workspace = 4, monitor:DP-1 #misc
workspace = 5, monitor:DP-2 #teams
workspace = 6, monitor:DP-2 #?
workspace = 7, monitor:DP-2 #?
workspace = 8, monitor:DP-7 #rider tool windows
workspace = 9, monitor:DP-7 #Dev tools

workspace = 1, layout:master
workspace = 2, layout:scrolling,column_width:1
workspace = 9, layout:scrolling direction:down
workspace = 8, layout:monocle

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = move-vscode
    match:class = code-oss
    workspace = 4
}

windowrule {
    name = move-dolphin
    match:class = dolphin
    workspace = 6
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
  name = move-vivaldi
  match:class = vivaldi-stable
  workspace = 3
}

windowrule {
  name = move-ghostty
  match:class = com.mitchellh.ghostty 
  workspace = 1
}


windowrule {
    name = move-teams
    match:class = teams-for-linux
    workspace = 5
}

windowrule {
    name = move-ytm
    match:class = YouTube Music Desktop App
    workspace = 5
}


#Rider Initial screen
windowrule {
    name = rider-floating-windows
    match:class=^jetbrains-rider
    match:title=^$
    match:float=1
    center=true
    size=1000 700 
}

# Rider Main windows
windowrule {
    name = move-rider
    match:class = jetbrains-rider
    workspace = 2
}

windowrule {
    name = move-rider2
    match:class = jetbrains-rider
    match:title = Welcome to JetBrains Rider
    float=true
    workspace = 2
}

# Rider tool windows → grouped on workspace 9
windowrule {
    name = move-rider-tools
    match:class = jetbrains-rider
    match:title = ^(Debug|Services|Build|Tests|Git|Commit|Run) - .*$
    no_initial_focus = on
    workspace = 9
}

windowrule {
    name = move-ytm
    match:class = YouTube Music Desktop App
    workspace=5
    no_initial_focus=on
}

windowrule {
    name = move-gparted
    match:class = gparted
    workspace=5
    no_initial_focus=on
}

windowrule {
    name = move-bruno
    match:class = bruno
    workspace=4
    no_initial_focus=on
}


windowrule {
    name = move-dev-tools
    match:class = vivaldi-stable
    match:title = ^Developer Tools - .*$
    group=set always
    no_initial_focus=on
    workspace=8
}

windowrule {
    name = move-dotnet-watch
    match:class = com.mitchellh.ghostty 
    match:title = ^dotnet watch$
    workspace = 8 
}

