$terminal = ghostty
$fileManager = dolphin
$menu = rofi -show run

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14
env = XCURSOR_THEME,Adwaita
env = QT_QPA_PLATFORMTHEME,qt6ct

exec-once = systemctl --user start hyprland-session.target
exec-once = waybar
exec-once = waybar --config $HOME/dotfiles/.config/waybar/config-left.jsonc
exec-once = hyprpaper
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = hypridle

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

scrolling{
    direction = down


}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    #pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = slave
    always_keep_position = true
    orientation = right 
    mfact = .70
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true 
    disable_splash_rendering = true
}

group {
    auto_group = true
    col.border_active = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.border_inactive = rgba(595959aa)

    groupbar{
        enabled=false
        font_size = 14
        height = 18
        font_weight_active = bold
        col.active = rgba(66ffffff)
        col.inactive = rgba(66ffffff)
        indicator_height = 0
        indicator_gap = 5

        col.locked_active = rgba(66ffff00)
        col.locked_inactive = rgba(66ffff00)


    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    # -1.0 - 1.0, 0 means no modification.
    sensitivity = -0.4

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5

}
cursor {

    no_hardware_cursors = 1
}



$mainMod = SUPER

bind = $mainMod, Return, exec, ghostty
bind = $mainMod+shift, x, killactive,
bind = $mainMod+shift, F12, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, F12, exec, hyprlock 

bind = , F1, exec, rofi -show drun -log ~/rofi.log
bind = , F2, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = , F3, exec, rofi -show calc -modi calc -no-show-match -no-sort

bind = $mainMod, F, fullscreen
bind = SUPER, TAB, layoutmsg, cyclenext
bind = ,Print, exec, grim -g "$(slurp)" - | wl-copy --type image/png 

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

bind = $mainMod, mouse:276, movewindow, l
bind = $mainMod, mouse:275, movewindow, r

bind = , mouse:276, movefocus, u
bind = , mouse:275, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, q, workspace, 5 
bind = $mainMod, r, workspace, 6
bind = $mainMod, t, workspace, 7
bind = $mainMod, w, workspace, 8
bind = $mainMod, e, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, q, movetoworkspace, 5
bind = $mainMod SHIFT, r, movetoworkspace, 6
bind = $mainMod SHIFT, t, movetoworkspace, 7
bind = $mainMod SHIFT, w, movetoworkspace, 8
bind = $mainMod SHIFT, e, movetoworkspace, 9

bind = $mainMod, M, togglespecialworkspace, music

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# See https://wiki.hypr.land/Configuring/Monitors/
#dekstop
monitor=DP-1,3840x2160@120,0x0, 1
monitor=DP-2, 3840x2160, 3840x0, 1  

# monitor=DP-1,3840x2160,0x0, 1
# monitor=DP-2, 2560x1440, 3840x0, 1  

monitor=DP-7, 1920x1080, -1080x0, 1, transform, 1
monitor=DP-8, 1920x1080, -1080x0, 1, transform, 1

# #laptop
# monitor=eDP-1,1920x1080,0x0, 1

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:DP-1 #terminal
workspace = 2, monitor:DP-1 #rider
workspace = 3, monitor:DP-1 #browser
workspace = 4, monitor:DP-1 #misc
workspace = 5, monitor:DP-2 #teams
workspace = 6, monitor:DP-2 #?
workspace = 7, monitor:DP-2 #?
workspace = 8, monitor:DP-7 #rider tool windows
workspace = 9, monitor:DP-7 #Dev tools

workspace = 1, layout:master
workspace = 2, layout:monocle
workspace = 9, layout:scrolling
workspace = 8, layout:monocle

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = move-vscode
    match:class = code-oss
    workspace = 4
}

windowrule {
    name = move-dolphin
    match:class = dolphin
    workspace = 6
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
  name = move-vivaldi
  match:class = vivaldi-stable
  workspace = 3
}

windowrule {
  name = move-ghostty
  match:class = com.mitchellh.ghostty 
  workspace = 1
}


windowrule {
    name = move-teams
    match:class = teams-for-linux
    workspace = 5
}

windowrule {
    name = move-ytm
    match:class = YouTube Music Desktop App
    workspace = 5
}


#Rider Initial screen
# windowrule {
#     name = rider-floating-windows
#     match:class=^jetbrains-rider
#     match:title=^$
#     match:float=1
#     center=true
#     size=1000 700 
# }

# Rider Main windows
windowrule {
    name = move-rider
    match:class = jetbrains-rider
    workspace = 2
}

windowrule {
    name = move-rider2
    match:class = jetbrains-rider
    match:title = Welcome to JetBrains Rider
    float=true
    workspace = 2
}

# Rider tool windows → grouped on workspace 9
windowrule {
    name = move-rider-tools
    match:class = jetbrains-rider
    match:title = ^(Debug|Services|Build|Tests|Git|Commit|Run) - .*$
    workspace = 9
}

windowrule {
    name = move-ytm
    match:class = YouTube Music Desktop App
    workspace=5
    no_initial_focus=on
}

windowrule {
    name = move-gparted
    match:class = gparted
    workspace=5
    no_initial_focus=on
}

windowrule {
    name = move-bruno
    match:class = bruno
    workspace=4
    no_initial_focus=on
}


windowrule {
    name = move-dev-tools
    match:class = vivaldi-stable
    match:title = ^Developer Tools - .*$
    group=set always
    no_initial_focus=on
    workspace=8
}

windowrule {
    name = move-dotnet-watch
    match:class = com.mitchellh.ghostty 
    match:title = ^dotnet watch$
    workspace = 8 
}

